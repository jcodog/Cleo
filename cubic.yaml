# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1
reviews:
  # Cloud reviews focus on implementation; local reviews and CodeRabbit cover tests.
  enabled: true
  incremental_commits: true
  check_drafts: true
  ignore:
    files:
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".github/scripts/test-*"
      - "**/test-*"
      - "**/test.sh"
      - "**/*_test.*"
      - "**/*-test.*"
      - "**/__tests__/**"
      - "tests/**"
      - "test/**"
      - "fixtures/**"
      - "**/fixtures/**"
      - "coverage/**"
      - ".coverage-tmp/**"
      - "**/_generated/**"
      - "dist/**"
      - "bun.lock"
    base_branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
      - "develop"
      - "development"
      - "staging"
    pr_labels:
      - "WIP"
      - "wip"
      - "skip-review"
      - "no-ai-*"
