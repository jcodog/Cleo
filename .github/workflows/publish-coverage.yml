name: Publish Coverage

on:
  workflow_run:
    workflows: [Regression Tests and Coverage]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  coverage-pages:
    name: Publish coverage site
    # Check the source run before this job receives Pages or OIDC permissions.
    if: >-
      github.repository == 'jcodog/Cleo' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/regression.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      # Share the original group so a new release can cancel stale publishers.
      group: coverage-pages
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publish static reports only. Do not check out or execute source-run code.
      - name: Download browsable coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-coverage-reports
          path: coverage-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Verify coverage site entrypoint
        run: test -f coverage-site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: coverage-site

      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
