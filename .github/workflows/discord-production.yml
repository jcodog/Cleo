name: Deploy Discord Production

on:
  push:
    branches: [main]
    paths:
      - "apps/discord-bot/**"
      - "packages/backend/**"
      - "packages/env/**"
      - "packages/logger/**"
      - "packages/shared/**"
      - "packages/typescript-config/**"
      - "ops/discord/**"
      - ".github/scripts/deploy-discord.sh"
      - ".github/scripts/package-discord-release.sh"
      - ".github/scripts/check-discord-runner.sh"
      - ".github/workflows/discord-production.yml"
      - ".nvmrc"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Validate and package, deploy, or roll back
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
          - rollback

permissions:
  contents: read

concurrency:
  group: discord-production
  cancel-in-progress: false

jobs:
  classify:
    name: Classify Discord changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            deploy="$(node apps/discord-bot/src/deployment/classifyChanges.ts deploy \
              "${{ github.event.before }}" "${{ github.sha }}")"
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          fi

  validate-package:
    name: Validate and package Discord bot
    needs: classify
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.classify.outputs.deploy == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'validate') ||
        (
          vars.CLEO_DISCORD_DEPLOY_ENABLED == 'true' &&
          (
            github.event_name != 'workflow_dispatch' ||
            inputs.operation == 'deploy'
          )
        )
      )
    environment: discord-production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify packaging architecture
        run: test "$(node -p '`${process.platform}-${process.arch}`')" = "linux-x64"

      - name: Install exact dependencies
        run: bun ci

      - name: Test Discord bot
        run: bun run --filter @workspace/discord-bot test

      - name: Test Convex backend
        run: bun run --filter @workspace/backend test

      - name: Typecheck Discord bot
        run: bun run --filter @workspace/discord-bot typecheck

      - name: Typecheck Convex backend
        run: bun run --filter @workspace/backend typecheck

      - name: Lint Discord bot
        run: bun run --filter @workspace/discord-bot lint

      - name: Lint Convex backend
        run: bun run --filter @workspace/backend lint

      - name: Build Discord bot
        run: bun run --filter @workspace/discord-bot build

      - name: Package portable Linux x64 release
        id: package
        run: >-
          bash .github/scripts/package-discord-release.sh
          "${{ runner.temp }}/cleo-discord-artifact"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/cleo-discord-artifact/*.tar.gz
            ${{ runner.temp }}/cleo-discord-artifact/*.sha256

      - name: Deploy Convex backend
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bun run --filter @workspace/backend deploy

      - name: Record validation-only success
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'validate'
        run: echo "Discord v3 validation and Linux x64 packaging passed on GitHub-hosted infrastructure."

  activate:
    name: Activate Discord release on production VPS
    needs:
      - classify
      - validate-package
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.validate-package.result == 'success' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.operation == 'deploy'
      )
    environment: discord-production
    runs-on: cleo-prod
    timeout-minutes: 10
    env:
      CLEO_DISCORD_DEPLOY_ROOT: /srv/cleo/discord-bot
      CLEO_DISCORD_ENV_FILE: /etc/cleo/discord-bot.env
      CLEO_DISCORD_SERVICE: cleo-discord.service
      CLEO_DISCORD_COMMAND_SERVICE: cleo-discord-register-commands.service
      CLEO_DISCORD_RUNTIME_USER: cleo
      CLEO_DISCORD_RUNTIME_GROUP: cleo
      CLEO_DISCORD_DEPLOY_GROUP: cleo-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify production runner contract
        run: bash .github/scripts/check-discord-runner.sh

      - name: Download validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-package.outputs.artifact_name }}
          path: ${{ runner.temp }}/cleo-discord-release

      - name: Verify release architecture
        env:
          CLEO_DISCORD_RELEASE_ARCHIVE: ${{ runner.temp }}/cleo-discord-release/cleo-discord-${{ github.sha }}.tar.gz
        run: |
          artifact_platform="$(tar -xOzf "$CLEO_DISCORD_RELEASE_ARCHIVE" ./.cleo-release-platform)"
          runtime_platform="$(node -p '`${process.platform}-${process.arch}`')"
          if [[ "$artifact_platform" != "$runtime_platform" ]]; then
            echo "Release platform $artifact_platform does not match production runtime $runtime_platform" >&2
            exit 1
          fi

      - name: Activate release
        env:
          CLEO_DISCORD_RELEASE_ARCHIVE: ${{ runner.temp }}/cleo-discord-release/cleo-discord-${{ github.sha }}.tar.gz
          CLEO_DISCORD_RELEASE_CHECKSUM: ${{ runner.temp }}/cleo-discord-release/cleo-discord-${{ github.sha }}.tar.gz.sha256
        run: bash .github/scripts/deploy-discord.sh deploy

  rollback:
    name: Roll back Discord production
    needs: classify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'rollback'
    environment: discord-production
    runs-on: cleo-prod
    timeout-minutes: 10
    env:
      CLEO_DISCORD_DEPLOY_ROOT: /srv/cleo/discord-bot
      CLEO_DISCORD_ENV_FILE: /etc/cleo/discord-bot.env
      CLEO_DISCORD_SERVICE: cleo-discord.service
      CLEO_DISCORD_COMMAND_SERVICE: cleo-discord-register-commands.service
      CLEO_DISCORD_RUNTIME_USER: cleo
      CLEO_DISCORD_RUNTIME_GROUP: cleo
      CLEO_DISCORD_DEPLOY_GROUP: cleo-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify production runner contract
        run: bash .github/scripts/check-discord-runner.sh

      - name: Roll back to previous release
        run: bash .github/scripts/deploy-discord.sh rollback
