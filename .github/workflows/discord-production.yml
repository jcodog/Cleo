name: Deploy Discord Production

on:
  push:
    branches: [main]
    paths:
      - "apps/discord-bot/**"
      - "packages/backend/**"
      - "packages/env/**"
      - "packages/logger/**"
      - "packages/shared/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - ".github/scripts/deploy-discord.sh"
      - ".github/scripts/check-discord-runner.sh"
      - ".github/workflows/discord-production.yml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected commit or roll back to the previous release
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read

concurrency:
  group: discord-production
  cancel-in-progress: false

jobs:
  classify:
    name: Classify Discord changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            deploy="$(node apps/discord-bot/src/deployment/classifyChanges.ts deploy \
              "${{ github.event.before }}" "${{ github.sha }}")"
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Validate and deploy Discord bot
    needs: classify
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.classify.outputs.deploy == 'true' &&
      (
        vars.CLEO_DISCORD_DEPLOY_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback')
      )
    environment: discord-production
    runs-on: cleo-prod
    timeout-minutes: 45
    env:
      CLEO_DISCORD_DEPLOY_ROOT: /srv/cleo/discord-bot
      CLEO_DISCORD_ENV_FILE: /etc/cleo/discord-bot.env
      CLEO_DISCORD_SERVICE: cleo-discord.service
      CLEO_DISCORD_COMMAND_SERVICE: cleo-discord-register-commands.service
      CLEO_DISCORD_RUNTIME_USER: cleo
      CLEO_DISCORD_RUNTIME_GROUP: cleo
      CLEO_DISCORD_DEPLOY_GROUP: cleo-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify production runner contract
        run: bash .github/scripts/check-discord-runner.sh

      - name: Install exact dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm install --frozen-lockfile

      - name: Check peer dependency compatibility
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm check:peers

      - name: Test Discord bot
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/discord-bot run test

      - name: Test Convex backend
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/backend run test

      - name: Typecheck Discord bot
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/discord-bot run typecheck

      - name: Typecheck Convex backend
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/backend run typecheck

      - name: Lint Discord bot
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/discord-bot run lint

      - name: Lint Convex backend
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/backend run lint

      - name: Build Discord bot
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        run: pnpm --filter @workspace/discord-bot run build

      - name: Deploy Convex backend
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @workspace/backend run deploy

      - name: Deploy or roll back
        run: >-
          bash .github/scripts/deploy-discord.sh
          "${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}"
