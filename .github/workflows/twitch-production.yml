name: Deploy Twitch Production

on:
  push:
    branches: [main]
    paths:
      - "apps/twitch-bot/**"
      - "apps/discord-bot/src/deployment/classifyChanges.ts"
      - "packages/backend/**"
      - "packages/env/**"
      - "packages/logger/**"
      - "packages/shared/**"
      - "packages/typescript-config/**"
      - "ops/twitch/**"
      - ".github/workflows/twitch-production.yml"
      - ".nvmrc"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - "tsconfig*.json"
      - "convex.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".oxlintrc.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Validate and package or deploy
        required: true
        default: validate
        type: choice
        options: [validate, deploy]
      deploy_backend:
        description: Deploy Convex for this manual release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: twitch-production
  cancel-in-progress: false

jobs:
  validate-package:
    if: github.ref == 'refs/heads/main'
    environment: twitch-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      deploy_enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Resolve protected environment deploy gate
        id: gate
        env:
          DEPLOY_ENABLED: ${{ vars.CLEO_TWITCH_DEPLOY_ENABLED }}
        run: |
          enabled=false
          if [[ "${DEPLOY_ENABLED,,}" == true ]]; then enabled=true; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Checkout exact trusted commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify backend changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BACKEND: ${{ inputs.deploy_backend }}
        run: |
          set -euo pipefail
          backend=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            backend="$MANUAL_BACKEND"
          elif [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            backend=true
          else
            backend="$(node apps/discord-bot/src/deployment/classifyChanges.ts backend "$BEFORE_SHA" "$RELEASE_SHA")"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
      - name: Frozen dependency install
        run: bun ci
      - name: Verify the build source matches the trusted commit
        run: git diff --exit-code
      - name: Twitch and backend behavior checks
        run: |
          bun run --filter @workspace/twitch-bot test:coverage
          bun run --filter @workspace/backend test
          bun run --filter @workspace/twitch-bot typecheck
          bun run --filter @workspace/backend typecheck
          bun run --filter @workspace/twitch-bot lint
          bun run --filter @workspace/backend lint
      - name: Host deployment behavior checks
        run: bash ops/twitch/test.sh
      - name: Build Twitch once
        run: bun run --filter @workspace/twitch-bot build
      - name: Package and verify Linux x64 artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bun run --filter @workspace/twitch-bot package:release "${{ runner.temp }}/cleo-twitch-artifact" "$RELEASE_SHA"
      - name: Upload verified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleo-twitch-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/cleo-twitch-artifact/*.tar.gz
            ${{ runner.temp }}/cleo-twitch-artifact/*.sha256
      - name: Record validation result
        run: echo 'Twitch checks and immutable artifact verification passed. No chat message was sent.' >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: validate-package
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.validate-package.outputs.deploy_enabled == 'true' &&
      needs.validate-package.outputs.backend == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    environment: twitch-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cleo-convex-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install and deploy required backend changes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          bun ci
          bun run --filter @workspace/backend deploy

  activate:
    needs: [validate-package, backend]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.validate-package.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      needs.validate-package.outputs.deploy_enabled == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
    environment: twitch-production
    runs-on: cleo-prod
    timeout-minutes: 10
    steps:
      - name: Verify installed host contract
        run: /usr/local/libexec/cleo/twitch/check-twitch-runner
      - name: Download verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cleo-twitch-${{ github.sha }}
          path: ${{ runner.temp }}/cleo-twitch-release
      - name: Activate with readiness and automatic rollback
        env:
          RELEASE_SHA: ${{ github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/cleo-twitch-release
        run: |
          set +e
          /usr/local/libexec/cleo/twitch/deploy-twitch-release deploy "$RELEASE_SHA" \
            "$ARTIFACT_DIRECTORY/cleo-twitch-$RELEASE_SHA.tar.gz" \
            "$ARTIFACT_DIRECTORY/cleo-twitch-$RELEASE_SHA.tar.gz.sha256"
          result=$?
          set -e
          {
            echo '### Twitch production activation'
            echo "Attempted SHA: $RELEASE_SHA"
            echo "Controller exit status: $result"
            echo "Current release: $(readlink -f /srv/cleo/twitch-bot/current || true)"
            echo "Service: $(systemctl is-active cleo-twitch.service || true)"
            echo 'Readiness failure triggers verified rollback or stops the service. No smoke message is sent.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
