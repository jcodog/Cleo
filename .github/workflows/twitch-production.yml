name: Twitch Production Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate current main packages or roll back the recorded runtime
        required: true
        default: validate
        type: choice
        options: [validate, rollback]

permissions: {}

jobs:
  operations:
    if: github.repository == 'jcodog/Cleo' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/production-release.yml
    with:
      operation: ${{ inputs.operation }}
      sha: ${{ github.sha }}
      service: twitch
