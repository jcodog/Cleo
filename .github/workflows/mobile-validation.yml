name: Native mobile validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  expo:
    name: Expo compatibility and native bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: bun ci
      - name: Native types, lint, tests and coverage
        run: |
          bun run --filter @workspace/mobile typecheck
          bun run --filter @workspace/mobile lint
          bun run --filter @workspace/mobile test:coverage
          bun run test:mobile:build-config
      - name: Check SDK compatibility and export JavaScript bundles
        env:
          CI: "1"
          EXPO_PUBLIC_CONVEX_URL: https://build-only.convex.cloud
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: |
          bun run --filter @workspace/mobile check:expo
          bun run --filter @workspace/mobile build
      - name: Preserve native coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-coverage
          path: coverage/apps/mobile
          if-no-files-found: warn
          retention-days: 14
