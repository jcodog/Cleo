name: Regression Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Tests, lint, typecheck, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependency compatibility
        run: pnpm check:peers

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Run workspace tests with coverage
        run: pnpm test:coverage

      - name: Verify coverage reports
        run: |
          reports=(
            "coverage/apps/dashboard/cobertura-coverage.xml"
            "coverage/apps/discord-bot/cobertura-coverage.xml"
            "coverage/packages/backend/cobertura-coverage.xml"
            "coverage/packages/env/cobertura-coverage.xml"
            "coverage/packages/logger/cobertura-coverage.xml"
            "coverage/packages/shared/cobertura-coverage.xml"
            "coverage/packages/ui/cobertura-coverage.xml"
            "coverage/apps/dashboard/index.html"
            "coverage/apps/discord-bot/index.html"
            "coverage/packages/backend/index.html"
            "coverage/packages/env/index.html"
            "coverage/packages/logger/index.html"
            "coverage/packages/shared/index.html"
            "coverage/packages/ui/index.html"
          )

          missing=0
          for report in "${reports[@]}"; do
            if [[ ! -f "$report" ]]; then
              echo "Missing coverage report: $report"
              missing=1
            fi
          done

          exit "$missing"

      - name: Build browsable coverage site
        run: node .github/scripts/build-coverage-site.mjs

      - name: Upload Cobertura artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage-reports
          if-no-files-found: error
          path: |
            coverage/apps/dashboard/cobertura-coverage.xml
            coverage/apps/discord-bot/cobertura-coverage.xml
            coverage/packages/backend/cobertura-coverage.xml
            coverage/packages/env/cobertura-coverage.xml
            coverage/packages/logger/cobertura-coverage.xml
            coverage/packages/shared/cobertura-coverage.xml
            coverage/packages/ui/cobertura-coverage.xml

      - name: Upload browsable HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-reports
          if-no-files-found: error
          path: coverage-site

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-site

  coverage-pages:
    name: Publish coverage site
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
