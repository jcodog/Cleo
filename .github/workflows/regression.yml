name: Regression Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Tests, lint, typecheck, and coverage
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun ci

      - name: Validate production operations scripts
        run: |
          bash -n .github/scripts/package-discord-release.sh
          bash -n .github/scripts/check-discord-bundle-symlinks.sh
          bash -n ops/discord/bootstrap-host.sh
          bash -n ops/discord/bin/check-discord-runner
          bash -n ops/discord/bin/check-discord-env
          bash -n ops/discord/bin/check-discord-runtime
          bash -n ops/discord/bin/deploy-discord-release
          bash -n ops/discord/bin/deploy-discord-release.test.sh
          bash -n ops/discord/bin/deploy-discord-release.validation.test.sh
          bash -n ops/discord/bin/migrate-discord-deployment-state
          bash -n ops/discord/bin/migrate-discord-deployment-state.test.sh
          bash -n ops/discord/bin/read-discord-deployment-state
          bash -n ops/discord/bin/read-discord-deployment-state.test.sh
          bash -n ops/discord/bin/check-discord-env.test.sh
          bash -n ops/discord/bin/run-discord-release
          bash -n ops/discord/bin/run-discord-release.test.sh
          bash ops/discord/bin/check-discord-env.test.sh
          bash ops/discord/bin/run-discord-release.test.sh
          bash ops/discord/bin/read-discord-deployment-state.test.sh
          bash ops/discord/bin/migrate-discord-deployment-state.test.sh
          bash ops/discord/bin/deploy-discord-release.test.sh
          bash ops/discord/bin/deploy-discord-release.validation.test.sh

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Lint workspace with zero warnings
        run: bun run lint:ci

      - name: Run workspace tests with coverage
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee coverage-test.log

      - name: Upload failed coverage output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-coverage-output
          if-no-files-found: ignore
          path: coverage-test.log

      - name: Verify coverage reports
        run: |
          reports=(
            "coverage/apps/dashboard/cobertura-coverage.xml"
            "coverage/apps/discord-bot/cobertura-coverage.xml"
            "coverage/packages/backend/cobertura-coverage.xml"
            "coverage/packages/env/cobertura-coverage.xml"
            "coverage/packages/logger/cobertura-coverage.xml"
            "coverage/packages/shared/cobertura-coverage.xml"
            "coverage/packages/ui/cobertura-coverage.xml"
            "coverage/apps/dashboard/index.html"
            "coverage/apps/discord-bot/index.html"
            "coverage/packages/backend/index.html"
            "coverage/packages/env/index.html"
            "coverage/packages/logger/index.html"
            "coverage/packages/shared/index.html"
            "coverage/packages/ui/index.html"
          )

          missing=0
          for report in "${reports[@]}"; do
            if [[ ! -f "$report" ]]; then
              echo "Missing coverage report: $report"
              missing=1
            fi
          done

          exit "$missing"

      - name: Build browsable coverage site
        run: node .github/scripts/build-coverage-site.mjs

      - name: Test Discord release packaging
        run: |
          output_dir="${RUNNER_TEMP}/cleo-discord-package-test"
          extract_dir="${RUNNER_TEMP}/cleo-discord-package-extract"
          release_sha="$(git rev-parse HEAD)"
          bun run --filter @workspace/discord-bot build
          find apps/discord-bot/dist -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/discord-dist-before.sha256"
          CLEO_DISCORD_RELEASE_SHA="$release_sha" \
            bash .github/scripts/package-discord-release.sh "$output_dir"
          find apps/discord-bot/dist -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/discord-dist-after.sha256"
          diff -u "${RUNNER_TEMP}/discord-dist-before.sha256" "${RUNNER_TEMP}/discord-dist-after.sha256"
          archive="$output_dir/cleo-discord-${release_sha}.tar.gz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd "$output_dir" && sha256sum -c "$(basename "$checksum")")
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          test -f "$extract_dir/dist/index.js"
          test -f "$extract_dir/dist/index.js.map"
          test -f "$extract_dir/dist/scripts/registerCommands.js"
          test -f "$extract_dir/dist/scripts/registerCommands.js.map"
          test -f "$extract_dir/runtime-artifact.json"
          test -f "$extract_dir/release-manifest.json"
          test ! -e "$extract_dir/node_modules/@workspace/discord-bot"
          test ! -e "$extract_dir/src/index.ts"
          test ! -e "$extract_dir/node_modules/tsx/dist/cli.mjs"
          test -f "$extract_dir/.cleo-release-sha"
          test -f "$extract_dir/.cleo-release-platform"
          test "$(cat "$extract_dir/.cleo-release-sha")" = "$release_sha"
          test "$(cat "$extract_dir/.cleo-release-platform")" = "linux-arm64"
          test "$(node -p "require('$extract_dir/release-manifest.json').commitSha")" = "$release_sha"
          (
            cd "$extract_dir"
            node --input-type=module -e 'await import("./dist/scripts/registerCommands.js")'
            node --input-type=module -e '
              const { createCanvas } = await import("@napi-rs/canvas")
              await createCanvas(2, 2).encode("png")
            '
          )
          mv apps/discord-bot/dist "${RUNNER_TEMP}/discord-dist"
          if CLEO_DISCORD_RELEASE_SHA="$release_sha" \
            bash .github/scripts/package-discord-release.sh "$output_dir"; then
            echo "Packaging unexpectedly succeeded without compiled output" >&2
            exit 1
          fi
          mv "${RUNNER_TEMP}/discord-dist" apps/discord-bot/dist

          ln -s index.js apps/discord-bot/dist/untrusted-runtime-link.js
          if CLEO_DISCORD_RELEASE_SHA="$release_sha" \
            bash .github/scripts/package-discord-release.sh "$output_dir"; then
            echo "Packaging unexpectedly accepted a symlink in validated dist output" >&2
            exit 1
          fi
          rm -f apps/discord-bot/dist/untrusted-runtime-link.js

          symlink_fixture="$(mktemp -d "${RUNNER_TEMP}/discord-symlink-fixture.XXXXXX")"
          outside_fixture="$(mktemp "${RUNNER_TEMP}/discord-symlink-outside.XXXXXX")"
          ln -s missing-target "$symlink_fixture/dangling-link"
          if bash .github/scripts/check-discord-bundle-symlinks.sh "$symlink_fixture"; then
            echo "Packaging symlink validation unexpectedly accepted a dangling link" >&2
            exit 1
          fi
          rm -f "$symlink_fixture/dangling-link"
          ln -s "$outside_fixture" "$symlink_fixture/escaping-link"
          if bash .github/scripts/check-discord-bundle-symlinks.sh "$symlink_fixture"; then
            echo "Packaging symlink validation unexpectedly accepted a bundle-escaping link" >&2
            exit 1
          fi
          rm -rf "$symlink_fixture"
          rm -f "$outside_fixture"

      - name: Upload Cobertura artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-coverage-reports
          if-no-files-found: error
          path: |
            coverage/apps/dashboard/cobertura-coverage.xml
            coverage/apps/discord-bot/cobertura-coverage.xml
            coverage/packages/backend/cobertura-coverage.xml
            coverage/packages/env/cobertura-coverage.xml
            coverage/packages/logger/cobertura-coverage.xml
            coverage/packages/shared/cobertura-coverage.xml
            coverage/packages/ui/cobertura-coverage.xml

      - name: Upload browsable HTML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-coverage-reports
          if-no-files-found: error
          path: coverage-site

  coverage-pages:
    name: Publish coverage site
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download browsable coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-coverage-reports
          path: coverage-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: coverage-site

      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
