name: Regression Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs share a group per PR. Pushes and manual runs each keep their own run ID.
concurrency:
  group: regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun ci

      - name: Validate CI contracts and production operations scripts
        run: |
          bun run test:ci:production
          bash .github/scripts/test-operations.sh

      - name: Typecheck workspace
        run: bun run typecheck:production

      - name: Lint workspace with zero warnings
        run: bun run lint:production

  web-verification:
    name: Web verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun ci

      - name: Build both web applications
        # Public compile-only fixtures. No production credentials or backend calls.
        env:
          NEXT_PUBLIC_CONVEX_URL: https://build-only.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          NEXT_PUBLIC_SITE_URL: https://cleoai.cloud
          NEXT_PUBLIC_APP_URL: https://localhost:3100
        run: |
          bun run --filter @workspace/landing build
          bun run --filter @workspace/dashboard build
          bun run --filter @workspace/dashboard test:pwa:build

      - name: Install welcome verification browsers
        working-directory: apps/dashboard
        run: bunx --no-install playwright install --with-deps chromium firefox

      - name: Verify guild welcome controls in Chromium and Firefox
        run: bun run --filter @workspace/dashboard test:welcome:browser

      - name: Verify Twitch workspace and platform navigation in Chromium
        run: bun run --filter @workspace/dashboard test:twitch:browser

      - name: Test served dashboard PWA
        # Signed-out fixtures do not authenticate users or call Clerk/Convex APIs.
        env:
          NEXT_PUBLIC_CONVEX_URL: https://build-only.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_pwa_signed_out_fixture_not_a_real_key
          NEXT_PUBLIC_SITE_URL: https://cleoai.cloud
          NEXT_PUBLIC_APP_URL: https://localhost:3100
          PWA_TEST_ORIGIN: https://localhost:3100
        run: bash .github/scripts/test-dashboard-pwa.sh

      - name: Upload browser and PWA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: welcome-browser-verification
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7
          path: |
            apps/dashboard/test-results/welcome
            apps/dashboard/test-results/twitch
            ${{ runner.temp }}/dashboard-pwa.log

  tests-coverage:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun ci

      - name: Run workspace tests with coverage
        run: |
          set -o pipefail
          bun run test:coverage:production 2>&1 | tee "$RUNNER_TEMP/coverage-test.log"

      - name: Upload failed coverage output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-coverage-output
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/coverage-test.log

      - name: Verify reports and build browsable coverage site
        env:
          COVERAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/build-coverage-site.mjs --production

      - name: Upload Cobertura artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-coverage-reports
          if-no-files-found: error
          retention-days: 14
          path: |
            coverage/apps/dashboard/cobertura-coverage.xml
            coverage/apps/landing/cobertura-coverage.xml
            coverage/apps/discord-bot/cobertura-coverage.xml
            coverage/apps/twitch-bot/cobertura-coverage.xml
            coverage/packages/backend/cobertura-coverage.xml
            coverage/packages/env/cobertura-coverage.xml
            coverage/packages/logger/cobertura-coverage.xml
            coverage/packages/shared/cobertura-coverage.xml
            coverage/packages/ui/cobertura-coverage.xml

      - name: Upload browsable HTML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-coverage-reports
          if-no-files-found: error
          retention-days: 14
          path: coverage-site
  release-verification:
    name: Release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun ci

      - name: Verify Twitch Linux release and packaging security
        run: |
          set -o pipefail
          bash .github/scripts/verify-twitch-release.sh 2>&1 | tee "$RUNNER_TEMP/twitch-release-verification.log"

      - name: Verify Discord Linux release and packaging security
        run: |
          set -o pipefail
          bash .github/scripts/verify-discord-release.sh 2>&1 | tee "$RUNNER_TEMP/discord-release-verification.log"

      - name: Verify packaged welcome PNGs without host fonts
        env:
          DISABLE_SYSTEM_FONTS_LOAD: "1"
        run: |
          node "$RUNNER_TEMP/cleo-discord-package-extract/dist/verifyWelcomeRendering.js" \
            "$RUNNER_TEMP/welcome-render-verification" \
            "$RUNNER_TEMP/cleo-discord-package-extract/dist/welcome-assets"

      - name: Upload welcome rendering evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: welcome-render-verification
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/welcome-render-verification

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/*-release-verification.log
            ${{ runner.temp }}/*-release-contents.txt
            ${{ runner.temp }}/*-dist-*.sha256
            ${{ runner.temp }}/cleo-*-package-test/*.sha256
            ${{ runner.temp }}/cleo-discord-package-extract/release-manifest.json
            ${{ runner.temp }}/cleo-twitch-package-extract.*/manifest.json

  regression:
    name: Tests, lint, typecheck, and coverage
    needs:
      [code-quality, web-verification, tests-coverage, release-verification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every regression job to succeed
        if: always()
        env:
          QUALITY_RESULT: ${{ needs.code-quality.result }}
          WEB_RESULT: ${{ needs.web-verification.result }}
          COVERAGE_RESULT: ${{ needs.tests-coverage.result }}
          RELEASE_RESULT: ${{ needs.release-verification.result }}
        run: |
          results=("$QUALITY_RESULT" "$WEB_RESULT" "$COVERAGE_RESULT" "$RELEASE_RESULT")
          names=("Code quality" "Web verification" "Tests and coverage" "Release verification")
          failed=0
          for index in "${!results[@]}"; do
            printf '%s: %s\n' "${names[$index]}" "${results[$index]}"
            if [[ "${results[$index]}" != success ]]; then
              failed=1
            fi
          done
          exit "$failed"
