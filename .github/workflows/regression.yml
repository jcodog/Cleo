name: Regression Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Tests, lint, typecheck, and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production operations scripts
        run: |
          bash -n .github/scripts/check-discord-runner.sh
          bash -n .github/scripts/deploy-discord.sh
          bash -n .github/scripts/package-discord-release.sh
          bash -n ops/discord/bootstrap-host.sh
          bash -n ops/discord/bin/check-discord-env
          bash -n ops/discord/bin/check-discord-runtime
          bash -n ops/discord/bin/check-discord-env.test.sh
          bash ops/discord/bin/check-discord-env.test.sh

      - name: Check peer dependency compatibility
        run: pnpm check:peers

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Run workspace tests with coverage
        run: pnpm test:coverage

      - name: Verify coverage reports
        run: |
          reports=(
            "coverage/apps/dashboard/cobertura-coverage.xml"
            "coverage/apps/discord-bot/cobertura-coverage.xml"
            "coverage/packages/backend/cobertura-coverage.xml"
            "coverage/packages/env/cobertura-coverage.xml"
            "coverage/packages/logger/cobertura-coverage.xml"
            "coverage/packages/shared/cobertura-coverage.xml"
            "coverage/packages/ui/cobertura-coverage.xml"
            "coverage/apps/dashboard/index.html"
            "coverage/apps/discord-bot/index.html"
            "coverage/packages/backend/index.html"
            "coverage/packages/env/index.html"
            "coverage/packages/logger/index.html"
            "coverage/packages/shared/index.html"
            "coverage/packages/ui/index.html"
          )

          missing=0
          for report in "${reports[@]}"; do
            if [[ ! -f "$report" ]]; then
              echo "Missing coverage report: $report"
              missing=1
            fi
          done

          exit "$missing"

      - name: Build browsable coverage site
        run: node .github/scripts/build-coverage-site.mjs

      - name: Test Discord release packaging
        run: |
          output_dir="${RUNNER_TEMP}/cleo-discord-package-test"
          extract_dir="${RUNNER_TEMP}/cleo-discord-package-extract"
          release_sha="$(git rev-parse HEAD)"
          CLEO_DISCORD_RELEASE_SHA="$release_sha" \
            bash .github/scripts/package-discord-release.sh "$output_dir"
          archive="$output_dir/cleo-discord-${release_sha}.tar.gz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd "$output_dir" && sha256sum -c "$(basename "$checksum")")
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          test -f "$extract_dir/src/index.ts"
          test -f "$extract_dir/tsconfig.json"
          test -f "$extract_dir/node_modules/tsx/dist/cli.mjs"
          test -f "$extract_dir/.cleo-release-sha"
          test -f "$extract_dir/.cleo-release-platform"
          test "$(cat "$extract_dir/.cleo-release-sha")" = "$release_sha"
          test "$(cat "$extract_dir/.cleo-release-platform")" = "linux-x64"
          (
            cd "$extract_dir"
            node node_modules/tsx/dist/cli.mjs -e 'import("@/classes/Event")'
          )

      - name: Upload Cobertura artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-coverage-reports
          if-no-files-found: error
          path: |
            coverage/apps/dashboard/cobertura-coverage.xml
            coverage/apps/discord-bot/cobertura-coverage.xml
            coverage/packages/backend/cobertura-coverage.xml
            coverage/packages/env/cobertura-coverage.xml
            coverage/packages/logger/cobertura-coverage.xml
            coverage/packages/shared/cobertura-coverage.xml
            coverage/packages/ui/cobertura-coverage.xml

      - name: Upload browsable HTML artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: html-coverage-reports
          if-no-files-found: error
          path: coverage-site

  coverage-pages:
    name: Publish coverage site
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download browsable coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: html-coverage-reports
          path: coverage-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: coverage-site

      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
