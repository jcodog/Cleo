name: Discord Production Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-production-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify production runner contract
    if: github.ref == 'refs/heads/main'
    environment: discord-production
    runs-on: cleo-prod
    timeout-minutes: 5
    env:
      CLEO_DISCORD_DEPLOY_ROOT: /srv/cleo/discord-bot
      CLEO_DISCORD_ENV_FILE: /etc/cleo/discord-bot.env
      CLEO_DISCORD_SERVICE: cleo-discord.service
      CLEO_DISCORD_COMMAND_SERVICE: cleo-discord-register-commands.service
      CLEO_DISCORD_RUNTIME_USER: cleo
      CLEO_DISCORD_RUNTIME_GROUP: cleo
      CLEO_DISCORD_DEPLOY_GROUP: cleo-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify host, services, permissions, and toolchain
        run: bash .github/scripts/check-discord-runner.sh
