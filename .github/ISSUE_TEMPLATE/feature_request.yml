name: Feature request
description: Suggest a Cleo feature
title: "feat: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should be built?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web
        - Backend
        - Discord bot
        - Kick bot
        - WebSocket relay
        - Shared package
        - Tooling/docs
    validations:
      required: true
