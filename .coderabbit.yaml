# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_filters:
    # Release infrastructure has already passed actionlint, shell syntax, and
    # isolated deployment recovery validation. Keep this pass on application code.
    - "!.github/**"
    - "!docs/**"
    - "!packages/ui/**"

    # Tests and generated output are validation evidence, not review targets.
    - "!**/*.test.*"
    - "!**/*.spec.*"
    - "!**/__tests__/**"
    - "!**/test/**"
    - "!**/tests/**"
    - "!**/fixtures/**"
    - "!**/_generated/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!pnpm-lock.yaml"

    # Repository housekeeping and shared lint configuration are outside the
    # Discord v3 application review pass.
    - "!.gitignore"
    - "!CONTRIBUTING.md"
    - "!README.md"
    - "!package.json"
    - "!pnpm-workspace.yaml"
    - "!turbo.json"
    - "!packages/eslint-config/**"

    # These product areas are explicitly post-v3.0.0 release scope.
    - "!packages/shared/src/cleoEntitlements.*"
    - "!packages/shared/src/cleoPets.*"
    - "!packages/backend/convex/dbTables/cleoPets.ts"
    - "!packages/backend/convex/dbTables/appFeatureGates.ts"
    - "!packages/backend/convex/lib/appFeatureGates.ts"
    - "!packages/backend/convex/lib/clerkOAuth.ts"
    - "!packages/backend/convex/lib/clerkUserData.*"
    - "!packages/backend/convex/mutations/integrations/clerk/**"
    - "!apps/dashboard/src/components/ThemeToggle.tsx"
    - "!apps/dashboard/src/components/providers/theme-provider.tsx"
    - "!apps/dashboard/src/features/app-shell/AppPlatformSelector.tsx"
